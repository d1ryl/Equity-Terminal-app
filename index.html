<div id="root"><div id="boot">Loading Equity Terminal…</div></div>
<script type="text/babel" data-presets="react">

const { useState, useMemo } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, BarChart, Bar, Cell, ComposedChart, Area } = Recharts;

const SvgI = ({ size = 18, children }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ display: "block" }}>{children}</svg>
);
const TrendingUp = ({ size }) => <SvgI size={size}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></SvgI>;
const Sun = ({ size }) => <SvgI size={size}><circle cx="12" cy="12" r="4" /><line x1="12" y1="2" x2="12" y2="4" /><line x1="12" y1="20" x2="12" y2="22" /><line x1="4.9" y1="4.9" x2="6.3" y2="6.3" /><line x1="17.7" y1="17.7" x2="19.1" y2="19.1" /><line x1="2" y1="12" x2="4" y2="12" /><line x1="20" y1="12" x2="22" y2="12" /><line x1="4.9" y1="19.1" x2="6.3" y2="17.7" /><line x1="17.7" y1="6.3" x2="19.1" y2="4.9" /></SvgI>;
const Moon = ({ size }) => <SvgI size={size}><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" /></SvgI>;

// ----------------------------- themes -----------------------------
const THEMES = {
  dark: {
    bg: "#0A0F1C", panel: "#0F1727", panel2: "#131D31", line: "#1F2B44",
    ink: "#E9EEF8", mut: "#7E8CA6", gold: "#D4AF37", goldDim: "#9A7E2C",
    green: "#3FB68B", red: "#E5564E", blue: "#5B8DEF", violet: "#A98BE6", shadow: "none", inputBg: "#0A0F1C",
  },
  light: {
    bg: "#F5F6F8", panel: "#FFFFFF", panel2: "#F0F2F6", line: "#E2E6EE",
    ink: "#16213A", mut: "#6B7689", gold: "#9A7B1F", goldDim: "#C8A24B",
    green: "#1E8E63", red: "#C8392F", blue: "#2E5FC0", violet: "#7A52C7",
    shadow: "0 1px 3px rgba(16,33,58,.08), 0 1px 2px rgba(16,33,58,.04)", inputBg: "#FBFCFE",
  },
};
const fontCss = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
@keyframes rise { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
* { box-sizing: border-box; }
.rise { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance:textfield; }
`;
const serif = "'Fraunces', Georgia, serif";
const sans = "'IBM Plex Sans', system-ui, sans-serif";
const mono = "'IBM Plex Mono', ui-monospace, monospace";

// ----------------------------- helpers -----------------------------
const fmt = (n, d = 2) => (isFinite(n) && n !== null ? n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "—");
const pct = (n, d = 1) => (isFinite(n) ? `${n >= 0 ? "+" : ""}${(n * 100).toFixed(d)}%` : "—");

function seeded(seed) { let s = seed; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }
function demoSeries() {
  const rnd = seeded(42); const out = []; let p = 190;
  const base = new Date(2026, 0, 6);
  for (let i = 0; i < 120; i++) {
    const drift = Math.sin(i / 11) * 0.012 + (rnd() - 0.5) * 0.022;
    p = Math.max(60, p * (1 + drift));
    const high = p * (1 + rnd() * 0.012), low = p * (1 - rnd() * 0.012);
    const dd = new Date(base); dd.setDate(dd.getDate() + i);
    out.push({ date: dd.toISOString().slice(0, 10), open: +(low + (high - low) * rnd()).toFixed(2), high: +high.toFixed(2), low: +low.toFixed(2), close: +p.toFixed(2), volume: Math.round(5e6 + rnd() * 6e6) });
  }
  return out;
}

// ---- support / resistance ----
function pivotPoints(b) { const { high: H, low: L, close: Cl } = b; const P = (H + L + Cl) / 3; return { P, R1: 2 * P - L, S1: 2 * P - H, R2: P + (H - L), S2: P - (H - L), R3: H + 2 * (P - L), S3: L - 2 * (H - P) }; }
function swingLevels(data, k = 4) {
  const highs = [], lows = [];
  for (let i = k; i < data.length - k; i++) {
    const win = data.slice(i - k, i + k + 1);
    if (data[i].high === Math.max(...win.map((b) => b.high))) highs.push(data[i].high);
    if (data[i].low === Math.min(...win.map((b) => b.low))) lows.push(data[i].low);
  }
  const cluster = (arr) => {
    const sorted = [...arr].sort((a, b) => a - b); const out = [];
    for (const v of sorted) { const last = out[out.length - 1]; if (last && Math.abs(v - last.avg) / last.avg < 0.01) { last.n += 1; last.sum += v; last.avg = last.sum / last.n; } else out.push({ avg: v, sum: v, n: 1 }); }
    return out.sort((a, b) => b.n - a.n).slice(0, 3).map((o) => o.avg);
  };
  return { resistance: cluster(highs), support: cluster(lows) };
}
function fib(data) { const hi = Math.max(...data.map((b) => b.high)), lo = Math.min(...data.map((b) => b.low)); const span = hi - lo; return [0.236, 0.382, 0.5, 0.618, 0.786].map((r) => ({ label: `${(r * 100).toFixed(1)}%`, value: hi - span * r })); }

// ---- indicator math ----
const sma = (a, n) => a.map((_, i) => (i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((x, y) => x + y, 0) / n));
function ema(a, n) { const k = 2 / (n + 1); let prev; return a.map((v, i) => { if (i === 0) { prev = v; return v; } prev = v * k + prev * (1 - k); return prev; }); }
function bollinger(a, n = 20, k = 2) {
  return a.map((_, i) => {
    if (i < n - 1) return { u: null, m: null, l: null };
    const s = a.slice(i - n + 1, i + 1); const m = s.reduce((x, y) => x + y, 0) / n;
    const sd = Math.sqrt(s.reduce((x, y) => x + (y - m) ** 2, 0) / n);
    return { u: m + k * sd, m, l: m - k * sd };
  });
}
function vwap(data) { let pv = 0, vv = 0; return data.map((b) => { const tp = (b.high + b.low + b.close) / 3; pv += tp * (b.volume || 0); vv += (b.volume || 0); return vv ? pv / vv : null; }); }
function rsi(a, n = 14) {
  const out = Array(a.length).fill(null); let g = 0, l = 0;
  for (let i = 1; i < a.length; i++) {
    const ch = a[i] - a[i - 1], up = Math.max(ch, 0), dn = Math.max(-ch, 0);
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = 100 - 100 / (1 + (l === 0 ? 1e9 : g / l)); } }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = 100 - 100 / (1 + (l === 0 ? 1e9 : g / l)); }
  }
  return out;
}
function macd(a, f = 12, s = 26, sig = 9) { const ef = ema(a, f), es = ema(a, s); const line = a.map((_, i) => ef[i] - es[i]); const signal = ema(line, sig); return { line, signal, hist: line.map((v, i) => v - signal[i]) }; }
function stoch(data, n = 9) {
  const k = data.map((_, i) => { if (i < n - 1) return null; const s = data.slice(i - n + 1, i + 1); const hh = Math.max(...s.map((b) => b.high)), ll = Math.min(...s.map((b) => b.low)); return hh === ll ? 50 : 100 * (data[i].close - ll) / (hh - ll); });
  const d = k.map((_, i) => (i < 2 || k[i] == null || k[i - 1] == null || k[i - 2] == null ? null : (k[i] + k[i - 1] + k[i - 2]) / 3));
  const j = k.map((_, i) => (k[i] == null || d[i] == null ? null : 3 * k[i] - 2 * d[i]));
  return { k, d, j };
}
function cci(data, n = 20) { const tp = data.map((b) => (b.high + b.low + b.close) / 3); return tp.map((_, i) => { if (i < n - 1) return null; const s = tp.slice(i - n + 1, i + 1); const m = s.reduce((x, y) => x + y, 0) / n; const md = s.reduce((x, y) => x + Math.abs(y - m), 0) / n; return md === 0 ? 0 : (tp[i] - m) / (0.015 * md); }); }
function willr(data, n = 14) { return data.map((_, i) => { if (i < n - 1) return null; const s = data.slice(i - n + 1, i + 1); const hh = Math.max(...s.map((b) => b.high)), ll = Math.min(...s.map((b) => b.low)); return hh === ll ? -50 : -100 * (hh - data[i].close) / (hh - ll); }); }
function atr(data, n = 14) { const tr = data.map((b, i) => (i === 0 ? b.high - b.low : Math.max(b.high - b.low, Math.abs(b.high - data[i - 1].close), Math.abs(b.low - data[i - 1].close)))); const out = Array(data.length).fill(null); let a = 0; for (let i = 0; i < tr.length; i++) { if (i < n) { a += tr[i]; if (i === n - 1) { a /= n; out[i] = a; } } else { a = (a * (n - 1) + tr[i]) / n; out[i] = a; } } return out; }
function obv(data) { let o = 0; return data.map((b, i) => { if (i > 0) { if (b.close > data[i - 1].close) o += b.volume || 0; else if (b.close < data[i - 1].close) o -= b.volume || 0; } return o / 1e6; }); }

// ---- multi-stage DCF + CAPM ----
function runDCF({ fcf0, g1, years1, years2, gt, wacc, netDebt, shares, price }) {
  const proj = []; let pvSum = 0; let f = fcf0; const N = Math.max(0, Math.round(years1) + Math.round(years2));
  for (let t = 1; t <= N; t++) {
    let g; if (t <= years1) g = g1; else { const k = t - years1; g = g1 + (gt - g1) * (k / years2); }
    f = f * (1 + g); const pv = f / Math.pow(1 + wacc, t); pvSum += pv;
    proj.push({ year: `Y${t}`, fcf: f, pv, phase: t <= years1 ? "growth" : "fade" });
  }
  const valid = wacc > gt && N > 0;
  const tv = valid ? (f * (1 + gt)) / (wacc - gt) : NaN;
  const pvTV = valid ? tv / Math.pow(1 + wacc, N) : NaN;
  const ev = pvSum + pvTV, equity = ev - netDebt, perShare = equity / shares;
  return { proj, pvSum, tv, pvTV, ev, equity, perShare, upside: perShare / price - 1, valid, N };
}
function capmWACC({ rf, beta, erp, kd, tax, eVal, dVal }) { const ke = rf + beta * erp; const tot = eVal + dVal; const we = tot ? eVal / tot : 1, wd = tot ? dVal / tot : 0; return { ke, we, wd, wacc: we * ke + wd * kd * (1 - tax) }; }

// ----------------------------- atoms -----------------------------
const Field = ({ label, value, onChange, step = "any", suffix, c }) => (
  <label style={{ display: "block", marginBottom: 12 }}>
    <span style={{ fontSize: 11, color: c.mut, textTransform: "uppercase", letterSpacing: ".08em" }}>{label}</span>
    <div style={{ position: "relative", marginTop: 4 }}>
      <input type="number" step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} style={{ width: "100%", background: c.inputBg, border: `1px solid ${c.line}`, color: c.ink, fontFamily: mono, fontSize: 14, padding: "8px 10px", borderRadius: 6, outline: "none" }} />
      {suffix && <span style={{ position: "absolute", right: 10, top: 9, color: c.mut, fontSize: 12, fontFamily: mono }}>{suffix}</span>}
    </div>
  </label>
);
const Stat = ({ label, value, color, c }) => (
  <div style={{ flex: 1, minWidth: 120 }}>
    <div style={{ fontSize: 11, color: c.mut, textTransform: "uppercase", letterSpacing: ".08em" }}>{label}</div>
    <div style={{ fontFamily: mono, fontSize: 22, color: color || c.ink, marginTop: 4 }}>{value}</div>
  </div>
);
function LevelTable({ title, rows, c }) {
  return (
    <div style={{ minWidth: 200, flex: 1 }}>
      <div style={{ fontFamily: serif, fontSize: 15, marginBottom: 8, color: c.ink }}>{title}</div>
      <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: mono, fontSize: 13 }}>
        <tbody>{rows.map((r, i) => (<tr key={i} style={{ borderTop: i ? `1px solid ${c.line}` : "none" }}><td style={{ padding: "6px 4px", color: c.mut }}>{r[0]}</td><td style={{ padding: "6px 4px", textAlign: "right", color: r[2] }}>{fmt(r[1], 3)}</td></tr>))}</tbody>
      </table>
    </div>
  );
}

// ----------------------------- main -----------------------------
export default function App() {
  const [mode, setMode] = useState("dark");
  const c = THEMES[mode];
  const [tab, setTab] = useState("tech");
  const [code, setCode] = useState("US.NVDA");
  const [backend, setBackend] = useState("https://equity-terminal-ashy.vercel.app");
  const [data, setData] = useState(demoSeries());
  const [loading, setLoading] = useState(false);
  const [status, setStatus] = useState("demo");
  const [note, setNote] = useState("Ready. Enter a US ticker (e.g. US.NVDA) and tap Fetch for live data.");

  // indicator UI state
  const [overlays, setOverlays] = useState({ sma: true, ema: false, bb: false, vwap: false });
  const [osc, setOsc] = useState("rsi");

  // DCF
  const [d, setD] = useState({ fcf0: 100000, g1: 0.08, years1: 5, years2: 5, gt: 0.025, wacc: 0.085, netDebt: -50000, shares: 15000, price: 190 });
  const setDcf = (k) => (v) => setD((s) => ({ ...s, [k]: v }));
  const [fcfHist, setFcfHist] = useState(null);
  const [fcfMode, setFcfMode] = useState("avg");
  function applyBase(m, hist) { if (!hist || !hist.length) return; const vals = hist.map((h) => h.free_cash_flow); const v = m === "avg" ? vals.reduce((a, b) => a + b, 0) / vals.length : vals[vals.length - 1]; setD((prev) => ({ ...prev, fcf0: +(v / 1e6).toFixed(0) })); }
  const [showCapm, setShowCapm] = useState(false);
  const [capm, setCapm] = useState({ rf: 0.043, beta: 1.15, erp: 0.05, kd: 0.045, tax: 0.21, eVal: 2900000, dVal: 100000 });
  const setCp = (k) => (v) => setCapm((s) => ({ ...s, [k]: v }));
  const capmRes = useMemo(() => capmWACC(capm), [capm]);

  const last = data[data.length - 1];
  const piv = useMemo(() => pivotPoints(last), [last]);
  const sw = useMemo(() => swingLevels(data), [data]);
  const fibs = useMemo(() => fib(data), [data]);
  const dcf = useMemo(() => runDCF(d), [d]);

  // compute all indicators once
  const ind = useMemo(() => {
    const cl = data.map((b) => b.close);
    return { sma20: sma(cl, 20), ema50: ema(cl, 50), bb: bollinger(cl, 20, 2), vwap: vwap(data), rsi: rsi(cl, 14), macd: macd(cl), stoch: stoch(data, 9), cci: cci(data, 20), willr: willr(data, 14), atr: atr(data, 14), obv: obv(data) };
  }, [data]);

  const priceData = data.map((b, i) => ({ date: b.date, close: b.close, sma20: ind.sma20[i], ema50: ind.ema50[i], bbU: ind.bb[i].u, bbM: ind.bb[i].m, bbL: ind.bb[i].l, vwap: ind.vwap[i] }));

  async function fetchLive() {
    setLoading(true); setNote("Fetching…");
    try {
      const r = await fetch(`${backend}/api/candles?code=${encodeURIComponent(code)}&count=120`);
      const j = await r.json();
      if (!j.bars || !j.bars.length) throw new Error(j.detail || "no candles returned");
      setData(j.bars); setStatus("live");
      let extra = "";
      try { const s = await (await fetch(`${backend}/api/snapshot?code=${encodeURIComponent(code)}`)).json(); setD((prev) => ({ ...prev, price: s.last_price ?? prev.price, shares: s.issued_shares ? +(s.issued_shares / 1e6).toFixed(0) : prev.shares })); } catch (_) {}
      try { const f = await (await fetch(`${backend}/api/fundamentals?code=${encodeURIComponent(code)}&years=3`)).json(); if (f.history && f.history.length) { setFcfHist(f.history); applyBase(fcfMode, f.history); extra = ` · FCF (${fcfMode === "avg" ? "3-yr avg" : "FY" + f.fiscal_year}) from SEC EDGAR`; } } catch (_) {}
      setNote(`Live · ${j.count} bars for ${code}.${extra}`);
    } catch (e) {
      setStatus("error");
      const httpsPage = typeof window !== "undefined" && window.location.protocol === "https:";
      let hint = "Open " + backend + "/api/health directly — if that fails, the backend isn't running.";
      if (httpsPage && backend.startsWith("http://")) hint = "This page is HTTPS but the backend is HTTP — browsers block that. Use your deployed https Vercel URL, or open " + backend + "/api/health to confirm the backend is up.";
      setNote("Fetch failed — " + e.message + ". " + hint);
    } finally { setLoading(false); }
  }

  const dot = status === "live" ? c.green : status === "error" ? c.red : c.mut;
  const waccRow = [-0.02, -0.01, 0, 0.01, 0.02].map((x) => d.wacc + x);
  const gCol = [-0.01, -0.005, 0, 0.005, 0.01].map((x) => d.gt + x);
  const card = { border: `1px solid ${c.line}`, background: c.panel, boxShadow: c.shadow };
  const inputStyle = { background: c.panel, border: `1px solid ${c.line}`, color: c.ink, fontFamily: mono, padding: "8px 10px", borderRadius: 6 };
  const chip = (active) => ({ background: active ? c.gold : "transparent", color: active ? (mode === "dark" ? "#1A1304" : "#fff") : c.mut, border: `1px solid ${active ? c.gold : c.line}`, padding: "5px 11px", borderRadius: 20, cursor: "pointer", fontFamily: sans, fontSize: 12, fontWeight: 500 });
  const segBtn = (active) => ({ flex: 1, background: active ? c.gold : "transparent", color: active ? (mode === "dark" ? "#1A1304" : "#fff") : c.mut, border: `1px solid ${active ? c.gold : c.line}`, padding: "6px 8px", borderRadius: 6, cursor: "pointer", fontFamily: sans, fontSize: 12, fontWeight: 500 });
  const tip = { background: c.panel2, border: `1px solid ${c.line}`, borderRadius: 6, fontFamily: mono, fontSize: 12, color: c.ink };

  // oscillator lower pane
  function OscPane() {
    if (osc === "none") return null;
    const xs = { dataKey: "date", tick: { fill: c.mut, fontSize: 9 }, minTickGap: 50, stroke: c.line };
    const ys = (extra = {}) => ({ tick: { fill: c.mut, fontSize: 9, fontFamily: mono }, stroke: c.line, width: 40, ...extra });
    const grid = <CartesianGrid stroke={c.line} strokeDasharray="2 4" vertical={false} />;
    if (osc === "macd") {
      const dd = data.map((b, i) => ({ date: b.date, macd: ind.macd.line[i], signal: ind.macd.signal[i], hist: ind.macd.hist[i] }));
      return (<ResponsiveContainer width="100%" height="100%"><ComposedChart data={dd} margin={{ top: 4, right: 64, left: 0, bottom: 0 }}>{grid}<XAxis {...xs} /><YAxis {...ys()} orientation="right" /><Tooltip contentStyle={tip} /><ReferenceLine y={0} stroke={c.mut} /><Bar dataKey="hist">{dd.map((p, i) => <Cell key={i} fill={p.hist >= 0 ? c.green : c.red} />)}</Bar><Line dataKey="macd" stroke={c.gold} dot={false} strokeWidth={1.5} /><Line dataKey="signal" stroke={c.blue} dot={false} strokeWidth={1.5} /></ComposedChart></ResponsiveContainer>);
    }
    if (osc === "kdj") {
      const dd = data.map((b, i) => ({ date: b.date, k: ind.stoch.k[i], d: ind.stoch.d[i], j: ind.stoch.j[i] }));
      return (<ResponsiveContainer width="100%" height="100%"><LineChart data={dd} margin={{ top: 4, right: 64, left: 0, bottom: 0 }}>{grid}<XAxis {...xs} /><YAxis {...ys()} orientation="right" domain={[0, 100]} /><Tooltip contentStyle={tip} /><ReferenceLine y={80} stroke={c.red} strokeDasharray="3 3" /><ReferenceLine y={20} stroke={c.green} strokeDasharray="3 3" /><Line dataKey="k" stroke={c.gold} dot={false} strokeWidth={1.5} /><Line dataKey="d" stroke={c.blue} dot={false} strokeWidth={1.5} /><Line dataKey="j" stroke={c.violet} dot={false} strokeWidth={1.5} /></LineChart></ResponsiveContainer>);
    }
    // single-line oscillators
    const cfg = {
      rsi: { vals: ind.rsi, domain: [0, 100], refs: [[70, c.red], [30, c.green]], color: c.gold },
      cci: { vals: ind.cci, domain: ["auto", "auto"], refs: [[100, c.red], [-100, c.green]], color: c.gold },
      willr: { vals: ind.willr, domain: [-100, 0], refs: [[-20, c.red], [-80, c.green]], color: c.gold },
      atr: { vals: ind.atr, domain: ["auto", "auto"], refs: [], color: c.violet },
      obv: { vals: ind.obv, domain: ["auto", "auto"], refs: [], color: c.blue },
    }[osc];
    const dd = data.map((b, i) => ({ date: b.date, v: cfg.vals[i] }));
    return (<ResponsiveContainer width="100%" height="100%"><LineChart data={dd} margin={{ top: 4, right: 64, left: 0, bottom: 0 }}>{grid}<XAxis {...xs} /><YAxis {...ys()} orientation="right" domain={cfg.domain} /><Tooltip contentStyle={tip} />{cfg.refs.map(([y, col], i) => <ReferenceLine key={i} y={y} stroke={col} strokeDasharray="3 3" />)}<Line dataKey="v" stroke={cfg.color} dot={false} strokeWidth={1.6} /></LineChart></ResponsiveContainer>);
  }
  const oscLabels = [["none", "None"], ["rsi", "RSI"], ["macd", "MACD"], ["kdj", "KDJ"], ["cci", "CCI"], ["willr", "W%R"], ["atr", "ATR"], ["obv", "OBV"]];

  return (
    <div style={{ background: c.bg, minHeight: "100vh", fontFamily: sans, color: c.ink, transition: "background .25s" }}>
      <style>{fontCss}</style>

      {/* header */}
      <div style={{ borderBottom: `1px solid ${c.line}`, padding: "18px 22px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 14, background: c.panel, boxShadow: c.shadow }}>
        <div className="rise" style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 38, height: 38, borderRadius: 9, border: `1.5px solid ${c.gold}`, display: "flex", alignItems: "center", justifyContent: "center", color: c.gold }}><TrendingUp size={20} /></div>
          <div><div style={{ fontFamily: serif, fontSize: 24, fontWeight: 600, letterSpacing: "-.01em", lineHeight: 1 }}>Equity <span style={{ color: c.gold }}>Terminal</span></div><div style={{ color: c.mut, fontSize: 12, marginTop: 3 }}>Support · Resistance · Indicators · DCF</div></div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginRight: 4 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: dot, animation: status === "live" ? "pulse 1.6s infinite" : "none" }} /><span style={{ fontSize: 11, color: c.mut, textTransform: "uppercase", letterSpacing: ".08em" }}>{status}</span></div>
          <input value={code} onChange={(e) => setCode(e.target.value)} placeholder="US.NVDA" style={{ ...inputStyle, width: 100, textTransform: "uppercase" }} />
          <input value={backend} onChange={(e) => setBackend(e.target.value)} placeholder="https://app.vercel.app" style={{ ...inputStyle, width: 185, fontSize: 12 }} />
          <button onClick={fetchLive} disabled={loading} style={{ background: c.gold, color: mode === "dark" ? "#1A1304" : "#FFFFFF", border: "none", fontWeight: 600, padding: "9px 16px", borderRadius: 6, cursor: "pointer", fontFamily: sans }}>{loading ? "…" : "Fetch"}</button>
          <button onClick={() => setMode(mode === "dark" ? "light" : "dark")} title="Toggle theme" style={{ background: c.panel2, border: `1px solid ${c.line}`, color: c.ink, width: 38, height: 38, borderRadius: 8, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>{mode === "dark" ? <Sun size={17} /> : <Moon size={17} />}</button>
        </div>
      </div>
      <div style={{ padding: "8px 22px", color: c.mut, fontSize: 12, borderBottom: `1px solid ${c.line}` }}>{note}</div>

      {/* tabs */}
      <div style={{ display: "flex", gap: 4, padding: "16px 22px 0" }}>
        {[["tech", "Technical (S/R + indicators)"], ["val", "Valuation (DCF)"]].map(([k, lbl]) => (<button key={k} onClick={() => setTab(k)} style={{ background: tab === k ? c.panel : "transparent", color: tab === k ? c.gold : c.mut, border: `1px solid ${tab === k ? c.line : "transparent"}`, borderBottom: "none", padding: "10px 18px", borderRadius: "8px 8px 0 0", cursor: "pointer", fontFamily: sans, fontSize: 14, fontWeight: 500 }}>{lbl}</button>))}
      </div>

      <div style={{ padding: "0 22px 60px" }}>
        {/* TECHNICAL */}
        {tab === "tech" && (
          <div className="rise" style={{ ...card, borderRadius: "0 10px 10px 10px", padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
              <div style={{ fontFamily: serif, fontSize: 18 }}>{code} — last {fmt(last.close, 2)}</div>
              <div style={{ color: c.mut, fontSize: 12, fontFamily: mono }}>{data.length} sessions</div>
            </div>

            {/* overlay toggles */}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
              <span style={{ fontSize: 11, color: c.mut, alignSelf: "center", textTransform: "uppercase", letterSpacing: ".08em" }}>Overlays</span>
              {[["sma", "SMA 20"], ["ema", "EMA 50"], ["bb", "Bollinger"], ["vwap", "VWAP"]].map(([k, l]) => (<button key={k} onClick={() => setOverlays((o) => ({ ...o, [k]: !o[k] }))} style={chip(overlays[k])}>{l}</button>))}
            </div>

            {/* price chart */}
            <div style={{ height: 280 }}>
              <ResponsiveContainer width="100%" height="100%">
                <ComposedChart data={priceData} margin={{ top: 6, right: 64, left: 0, bottom: 0 }}>
                  <CartesianGrid stroke={c.line} strokeDasharray="2 4" vertical={false} />
                  <XAxis dataKey="date" tick={{ fill: c.mut, fontSize: 10 }} minTickGap={40} stroke={c.line} />
                  <YAxis domain={["auto", "auto"]} tick={{ fill: c.mut, fontSize: 10, fontFamily: mono }} stroke={c.line} orientation="right" width={52} />
                  <Tooltip contentStyle={tip} labelStyle={{ color: c.mut }} />
                  {sw.resistance.map((v, i) => <ReferenceLine key={"r" + i} y={v} stroke={c.red} strokeDasharray="4 4" strokeOpacity={0.6} label={{ value: "R " + fmt(v, 2), fill: c.red, fontSize: 10, position: "right" }} />)}
                  {sw.support.map((v, i) => <ReferenceLine key={"s" + i} y={v} stroke={c.green} strokeDasharray="4 4" strokeOpacity={0.6} label={{ value: "S " + fmt(v, 2), fill: c.green, fontSize: 10, position: "right" }} />)}
                  {overlays.bb && <Line dataKey="bbU" stroke={c.blue} dot={false} strokeWidth={1} strokeDasharray="3 3" />}
                  {overlays.bb && <Line dataKey="bbL" stroke={c.blue} dot={false} strokeWidth={1} strokeDasharray="3 3" />}
                  {overlays.bb && <Line dataKey="bbM" stroke={c.blue} dot={false} strokeWidth={1} strokeOpacity={0.5} />}
                  {overlays.sma && <Line dataKey="sma20" stroke={c.violet} dot={false} strokeWidth={1.4} />}
                  {overlays.ema && <Line dataKey="ema50" stroke={c.green} dot={false} strokeWidth={1.4} />}
                  {overlays.vwap && <Line dataKey="vwap" stroke={c.red} dot={false} strokeWidth={1.2} strokeDasharray="5 3" />}
                  <Line dataKey="close" stroke={c.gold} strokeWidth={2} dot={false} />
                </ComposedChart>
              </ResponsiveContainer>
            </div>

            {/* oscillator selector + pane */}
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "16px 0 8px" }}>
              <span style={{ fontSize: 11, color: c.mut, alignSelf: "center", textTransform: "uppercase", letterSpacing: ".08em", marginRight: 4 }}>Oscillator</span>
              {oscLabels.map(([k, l]) => (<button key={k} onClick={() => setOsc(k)} style={{ ...segBtn(osc === k), flex: "none", padding: "5px 12px", borderRadius: 20 }}>{l}</button>))}
            </div>
            {osc !== "none" && <div style={{ height: 150 }}><OscPane /></div>}

            {/* S/R tables */}
            <div style={{ display: "flex", gap: 22, flexWrap: "wrap", marginTop: 18 }}>
              <LevelTable c={c} title="Pivot points (classic)" rows={[["R3", piv.R3, c.red], ["R2", piv.R2, c.red], ["R1", piv.R1, c.red], ["Pivot", piv.P, c.gold], ["S1", piv.S1, c.green], ["S2", piv.S2, c.green], ["S3", piv.S3, c.green]]} />
              <LevelTable c={c} title="Swing levels (fractal)" rows={[...sw.resistance.map((v) => ["Resistance", v, c.red]), ...sw.support.map((v) => ["Support", v, c.green])]} />
              <LevelTable c={c} title="Fibonacci retracement" rows={fibs.map((f) => [f.label, f.value, c.blue])} />
            </div>
          </div>
        )}

        {/* VALUATION */}
        {tab === "val" && (
          <div className="rise" style={{ ...card, borderRadius: "0 10px 10px 10px", padding: 18 }}>
            <div style={{ border: `1px solid ${c.line}`, borderRadius: 8, marginBottom: 18, overflow: "hidden" }}>
              <button onClick={() => setShowCapm(!showCapm)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, background: c.panel2, border: "none", color: c.ink, padding: "11px 14px", cursor: "pointer", fontFamily: sans, fontSize: 14, fontWeight: 500 }}>{showCapm ? "▾" : "▸"}Build WACC (CAPM)<span style={{ marginLeft: "auto", fontFamily: mono, color: c.gold }}>WACC ≈ {pct(capmRes.wacc, 2)}</span></button>
              {showCapm && (<div style={{ padding: 14 }}>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>{[["Risk-free rate", "rf", "0.001", "dec"], ["Beta", "beta", "0.05", ""], ["Equity risk premium", "erp", "0.005", "dec"], ["Pre-tax cost of debt", "kd", "0.005", "dec"], ["Tax rate", "tax", "0.01", "dec"], ["Equity value (m)", "eVal", "any", ""], ["Debt (m)", "dVal", "any", ""]].map(([lbl, key, st, sfx]) => (<div key={key} style={{ width: 150 }}><Field c={c} label={lbl} value={capm[key]} onChange={setCp(key)} step={st} suffix={sfx} /></div>))}</div>
                <div style={{ display: "flex", gap: 18, alignItems: "center", flexWrap: "wrap", marginTop: 4 }}><div style={{ fontFamily: mono, fontSize: 13, color: c.mut }}>Cost of equity <span style={{ color: c.ink }}>{pct(capmRes.ke, 2)}</span></div><div style={{ fontFamily: mono, fontSize: 13, color: c.mut }}>Weights E/D <span style={{ color: c.ink }}>{pct(capmRes.we, 0)} / {pct(capmRes.wd, 0)}</span></div><button onClick={() => setDcf("wacc")(+capmRes.wacc.toFixed(4))} style={{ marginLeft: "auto", background: c.gold, color: mode === "dark" ? "#1A1304" : "#fff", border: "none", fontWeight: 600, padding: "8px 14px", borderRadius: 6, cursor: "pointer", fontFamily: sans, fontSize: 13 }}>Apply to WACC →</button></div>
              </div>)}
            </div>

            <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
              <div style={{ width: 240 }}>
                <div style={{ fontFamily: serif, fontSize: 16, marginBottom: 12, color: c.gold }}>Assumptions</div>
                <Field c={c} label="Base FCF (m)" value={d.fcf0} onChange={setDcf("fcf0")} />
                {fcfHist && (<div style={{ marginTop: -4, marginBottom: 12 }}><div style={{ display: "flex", gap: 6, marginBottom: 6 }}><button onClick={() => { setFcfMode("latest"); applyBase("latest", fcfHist); }} style={segBtn(fcfMode === "latest")}>Latest</button><button onClick={() => { setFcfMode("avg"); applyBase("avg", fcfHist); }} style={segBtn(fcfMode === "avg")}>3-yr avg</button></div><div style={{ fontFamily: mono, fontSize: 11, color: c.mut }}>{fcfHist.map((h) => `FY${String(h.fiscal_year).slice(2)} ${fmt(h.free_cash_flow / 1e9, 1)}B`).join(" · ")}</div></div>)}
                <Field c={c} label="High-growth rate" value={d.g1} onChange={setDcf("g1")} step="0.005" suffix="dec" />
                <Field c={c} label="High-growth yrs" value={d.years1} onChange={setDcf("years1")} step="1" />
                <Field c={c} label="Fade yrs" value={d.years2} onChange={setDcf("years2")} step="1" />
                <Field c={c} label="Terminal growth" value={d.gt} onChange={setDcf("gt")} step="0.005" suffix="dec" />
                <Field c={c} label="WACC" value={d.wacc} onChange={setDcf("wacc")} step="0.005" suffix="dec" />
                <Field c={c} label="Net debt (m)" value={d.netDebt} onChange={setDcf("netDebt")} />
                <Field c={c} label="Shares out (m)" value={d.shares} onChange={setDcf("shares")} />
                <Field c={c} label="Current price" value={d.price} onChange={setDcf("price")} step="0.01" />
              </div>
              <div style={{ flex: 1, minWidth: 280 }}>
                <div style={{ display: "flex", gap: 18, flexWrap: "wrap", background: c.panel2, padding: 16, borderRadius: 8, border: `1px solid ${c.line}` }}>
                  <Stat c={c} label="Intrinsic / share" value={fmt(dcf.perShare, 2)} color={c.gold} />
                  <Stat c={c} label="vs Price" value={pct(dcf.upside)} color={dcf.upside >= 0 ? c.green : c.red} />
                  <Stat c={c} label="Enterprise value (m)" value={fmt(dcf.ev, 0)} />
                  <Stat c={c} label="Equity value (m)" value={fmt(dcf.equity, 0)} />
                </div>
                {!dcf.valid && <div style={{ color: c.red, fontSize: 12, marginTop: 8 }}>⚠ WACC must exceed terminal growth.</div>}
                <div style={{ display: "flex", gap: 14, marginTop: 12, marginBottom: 4, fontSize: 11, color: c.mut, fontFamily: mono }}><span><span style={{ color: c.gold }}>■</span> high-growth PV</span><span><span style={{ color: c.blue }}>■</span> fade PV</span></div>
                <div style={{ height: 200 }}>
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={dcf.proj} margin={{ top: 6, right: 10, left: 0, bottom: 0 }}>
                      <CartesianGrid stroke={c.line} strokeDasharray="2 4" vertical={false} />
                      <XAxis dataKey="year" tick={{ fill: c.mut, fontSize: 11 }} stroke={c.line} />
                      <YAxis tick={{ fill: c.mut, fontSize: 10, fontFamily: mono }} stroke={c.line} width={48} />
                      <Tooltip contentStyle={tip} formatter={(v, n) => [fmt(v, 0), n === "fcf" ? "Projected FCF" : "PV of FCF"]} />
                      <Bar dataKey="fcf" fill={c.goldDim} fillOpacity={0.45} radius={[3, 3, 0, 0]} />
                      <Bar dataKey="pv" radius={[3, 3, 0, 0]}>{dcf.proj.map((p, i) => <Cell key={i} fill={p.phase === "growth" ? c.gold : c.blue} />)}</Bar>
                    </BarChart>
                  </ResponsiveContainer>
                </div>
                <div style={{ marginTop: 16 }}>
                  <div style={{ fontFamily: serif, fontSize: 15, marginBottom: 8 }}>Sensitivity — value / share</div>
                  <div style={{ overflowX: "auto" }}>
                    <table style={{ borderCollapse: "collapse", fontFamily: mono, fontSize: 12, width: "100%" }}>
                      <thead><tr><th style={{ color: c.mut, padding: 6, textAlign: "left" }}>WACC ↓ / g →</th>{gCol.map((g, i) => <th key={i} style={{ color: c.blue, padding: 6 }}>{(g * 100).toFixed(1)}%</th>)}</tr></thead>
                      <tbody>{waccRow.map((w, ri) => (<tr key={ri}><td style={{ color: c.blue, padding: 6 }}>{(w * 100).toFixed(1)}%</td>{gCol.map((g, ci) => { const r = runDCF({ ...d, wacc: w, gt: g }); const col = !r.valid ? c.mut : r.upside >= 0 ? c.green : c.red; const here = ri === 2 && ci === 2; return <td key={ci} style={{ padding: 6, textAlign: "center", color: col, background: here ? c.panel2 : "transparent", fontWeight: here ? 600 : 400 }}>{r.valid ? fmt(r.perShare, 2) : "—"}</td>; })}</tr>))}</tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
